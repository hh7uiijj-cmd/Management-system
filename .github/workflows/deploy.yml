name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - claude/vibrant-feynman-25k9f9

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project ft67-34e17
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
